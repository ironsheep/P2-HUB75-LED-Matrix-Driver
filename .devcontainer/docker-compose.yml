services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    # Name the built image so Docker reuses cached layers across rebuilds.
    image: p2-hub75-led-matrix-driver-dev:local
    volumes:
      - ..:/workspaces/p2-HUB75-LED-Matrix-Driver:cached
      - todo-mcp-data:/home/vscode/.local/share/todo-mcp
    command: sleep infinity
    # Note: features, postCreateCommand, extensions, and settings
    # are handled in devcontainer.json, not here

volumes:
  todo-mcp-data:
